name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without leading v)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C debuginfo=0

jobs:
  build:
    name: Build (ubuntu x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/tailcat-node dist/
          tar -C dist -czf tailcat-node-x86_64-linux-gnu.tar.gz tailcat-node
          shasum -a 256 tailcat-node-x86_64-linux-gnu.tar.gz > tailcat-node-x86_64-linux-gnu.tar.gz.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailcat-node-x86_64-linux-gnu
          path: |
            tailcat-node-x86_64-linux-gnu.tar.gz
            tailcat-node-x86_64-linux-gnu.tar.gz.sha256
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Determine release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Resolved version: ${VERSION} (tag: v${VERSION})"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "tailcat-node ${{ steps.version.outputs.version }}" \
            --notes "## tailcat-node ${{ steps.version.outputs.version }}

          Built binary for Linux x86_64.

          ### Assets
          - \`tailcat-node-x86_64-linux-gnu.tar.gz\` — Linux x86_64
          - \`tailcat-node-x86_64-linux-gnu.tar.gz.sha256\` — SHA256 checksum

          ### Verification
          \`\`\`bash
          shasum -a 256 -c tailcat-node-x86_64-linux-gnu.tar.gz.sha256
          \`\`\`
          " \
            --verify-tag \
            artifacts/*.tar.gz \
            artifacts/*.sha256
