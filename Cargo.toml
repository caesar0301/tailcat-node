[package]
name = "tailcat-node"
version = "0.0.1"
edition = "2021"
description = "Small cross-platform daemon around Tailcat - the networking substrate for agent runtimes"
license = "MIT"
rust-version = "1.74"

[[bin]]
name = "tailcat-node"
path = "src/main.rs"

[dependencies]
# CLI parsing
clap = { version = "4.5", features = ["derive", "env"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Async runtime
tokio = { version = "1", features = ["full"] }
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Error handling
anyhow = "1"
thiserror = "1"
# Misc
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
async-trait = "0.1"
rand = "0.8"
hostname = "0.4"
tracing-appender = "0.2"
which = "6"
hex = "0.4"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
